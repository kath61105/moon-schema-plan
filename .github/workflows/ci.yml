name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Format, interface and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # A fresh runner has no registry index, so resolving moonbitlang/x
      # (used by the executable package) fails until the index is fetched.
      - name: Update the package registry index
        run: moon update

      - name: Report toolchain version
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Check that the generated interface is current
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Type check without warnings
        run: moon check --deny-warn

  test:
    name: Test on ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # A fresh runner has no registry index, so resolving moonbitlang/x
      # (used by the executable package) fails until the index is fetched.
      - name: Update the package registry index
        run: moon update

      - name: Build every package
        run: moon build --target ${{ matrix.target }}

      - name: Run the test suite
        run: moon test --target ${{ matrix.target }} --deny-warn

  end-to-end:
    name: CLI and real database migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # A fresh runner has no registry index, so resolving moonbitlang/x
      # (used by the executable package) fails until the index is fetched.
      - name: Update the package registry index
        run: moon update

      - name: Install database clients
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y sqlite3 postgresql-client

      - name: Exercise every documented CLI invocation
        run: sh scripts/cli_smoke.sh

      - name: Apply generated migrations to a real SQLite database
        run: sh scripts/sqlite_e2e.sh

      - name: Apply generated migrations to a real PostgreSQL server
        run: sh scripts/postgres_e2e.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

      - name: Publish the example migration report
        run: |
          moon run cmd/main -- plan postgresql \
            --before examples/schema_v1.json \
            --after examples/schema_v2.json \
            --hints examples/rename_hints.json \
            --allow-destructive --format markdown >> "$GITHUB_STEP_SUMMARY"
